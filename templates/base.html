<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PocketSmart AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="nav">
  <a class="brand" href="/">PocketSmart <span>AI</span></a>
  <nav>
    <a href="/">Home</a>
    {% if user %}
      <a href="/dashboard">Dashboard</a>
      <a href="/history">History</a>
      <a class="btn small" href="/logout">Logout</a>
    {% else %}
      <a href="/login">Login</a>
      <a class="btn small" href="/register">Register</a>
    {% endif %}
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>© 2026 PocketSmart AI · Smart, budget-friendly recommendations</footer>
</body>
</html>
